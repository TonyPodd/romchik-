version: '3.8'

services:
  compreface-postgres-db:
    image: postgres:11.5
    container_name: compreface-postgres-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=frs
    volumes:
      - postgres-data:/var/lib/postgresql/data

  compreface-admin:
    image: exadel/compreface-admin:1.2.0
    container_name: compreface-admin
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_URL=jdbc:postgresql://compreface-postgres-db:5432/frs
      - SPRING_PROFILES_ACTIVE=dev
      - ENABLE_EMAIL_SERVER=false
      - EMAIL_HOST=smtp.gmail.com
      - EMAIL_USERNAME=username
      - EMAIL_FROM=username@gmail.com
      - EMAIL_PASSWORD=password
      - ADMIN_JAVA_OPTS=-Xmx8g
      - MAX_FILE_SIZE=10MB
      - MAX_REQUEST_SIZE=10MB
    depends_on:
      - compreface-postgres-db
      - compreface-api

  compreface-api:
    image: exadel/compreface-api:1.2.0
    container_name: compreface-api
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_URL=jdbc:postgresql://compreface-postgres-db:5432/frs
      - SPRING_PROFILES_ACTIVE=dev
      - API_JAVA_OPTS=-Xmx8g
    depends_on:
      - compreface-postgres-db

  compreface-fe:
    image: exadel/compreface-fe:1.2.0
    container_name: compreface-ui
    restart: always
    ports:
      - "8001:80"
    depends_on:
      - compreface-api
      - compreface-admin
    environment:
      - CLIENT_MAX_BODY_SIZE=10M
      - PROXY_READ_TIMEOUT=300000ms
      - PROXY_CONNECT_TIMEOUT=300000ms

  compreface-core:
    image: exadel/compreface-core:1.2.0
    container_name: compreface-core
    restart: always
    environment:
      - ML_PORT=3000
      - UWSGI_PROCESSES=2
      - UWSGI_THREADS=1
      - EXTRA_PLUGINS=facemask,age,gender,landmarks,pose,calculator

volumes:
  postgres-data:
